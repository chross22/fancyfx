# Served from camilleross.org/fancyfx/, not chross22.github.io: GitHub applies
# the user site's custom domain to every project page on the account. This must
# name where visitors actually land, or the canonical link, sitemap and og:url
# all point at a hostname nobody uses and search engines see two of each page.
url: https://camilleross.org/fancyfx/

# NOT docs/. Several of these packages keep hand-written design notes and
# methods write-ups in docs/, tracked in git, and a pkgdown build would erase
# them. pkgdown refuses outright when it finds a docs/ it did not create; this
# names a directory that is unambiguously generated.
destination: pkgdown-site

template:
  bootstrap: 5
  light-switch: true

reference:
- title: Effect plots
  desc: >
    Every effect curve is paired with a rug of the raw data stacked directly
    above it, so a bend can be read against how much data supports it. GAMs
    go through gratia, everything else through marginaleffects.
  contents:
  - effect_estimates.gbm
  - permutation_importance
  - plotEffects
  - plotImportance
  - plotRugs
  - plotSmooths

- title: Performance and calibration
  desc: >
    Whether the model is right, and whether its probabilities mean what they
    say.
  contents:
  - calc_deviance
  - calibration_estimates
  - held_out
  - plotCalibration
  - plotROC
  - plotThreshold
  - print.fancyfx_held_out
  - threshold_metrics

- title: Extrapolation and novelty
  desc: >
    Where a prediction is being made outside the data it was fitted on. MESS
    and the sorting-bias measures say how far outside.
  contents:
  - ensemble_summary
  - mess
  - niche_equivalency
  - niche_overlap
  - plot.fancyfx_equivalency
  - plotExtrapolation
  - plotUncertainty
  - spatial_sorting_bias

- title: Composition and style
  desc: >
    Arranging panels, binning dense scatter, and the palette and theme that
    keep a set of figures looking like one set.
  contents:
  - combinePlots
  - comparePlots
  - fancyfx_palette
  - hex_bin
  - plotHexbin
  - theme_fancyfx
  - thin_points
